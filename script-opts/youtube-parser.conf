 # Экстрактор, используемый для получения медиапотоков и метаданных. На данный момент доступны:
 # android_reel, android_testsuite, ios_reel (по умолчанию), ios_testsuite, android_vr_reel, visionos, visionos_reel | ios, android_vr, web (только метаданные)
 # Reel-экстракторы также извлекают доп. метаданные (дата публикации, число лайков, комментариев...) при том же числе запросов
 # Test-suite экстракторы не накладывают троттлинг при загрузке DASH потоков запросами, не разбитыми < 10 МБ (mpv git v0.42+ и патченный плеер из сборки это умеют)
 # Можно выбрать сразу несколько, вписав через запятую, но рекомендую вместо этого настроить ниже экстракторы для доп. парсинга лишь при необходимости
 # При значении default будет использоваться экстрактор по умолчанию, а также могут слегка корректироваться доп. экстракторы, стоящие в скрипте по умолчанию
 # (убираться нерабочие, заменяться на более стабильные аналоги) при обновлениях парсера
extractor=default
 
 # Скачивать и парсить ли HLS манифесты при наличии (no | auto | yes). 
 # auto - скачивать лишь в случае, если форматы из манифеста, скорее всего, будут выбраны по умолчанию
 # При отключении прямые трансляции не будут открываться!
parse_hls_manifests=auto
 # Скачивать ли данные веб-плеера для получения раскадровки в хорошем качестве и доп. метаданных параллельно с основным парсингом
 # Эти данные могут прибыть уже после открытия ролика; чтобы выполнить последовательный парсинг, можно добавить 'web' в список экстакторов
parse_web_player_async=yes
 # Разбивать ли загрузки каналов на категории (видео, shorts, трансляции) для их последующего отдельного парсинга (как это делает yt-dlp, подключённый к mpv)
 # При отключении все загрузки канала будут идти вперемешку, и это требует на 1 запрос меньше (как в парсере PotPlayer)
split_channel_by_tabs=yes

 # Разрешение видео, выбираемое по умолчанию
target_resolution=1440
 # Избегать ли AV1 кодек, если для желаемого качества доступны другие
skip_av1=yes
 # Избегать ли VP9 кодек, если для желаемого качества доступны другие
skip_vp9=no
 # Избегать ли HDR форматы
skip_hdr=yes
 # Пропускать ли ИИ-апскейлы от Ютуба при выборе качества
skip_ai_upscale=no
 # Пропускать ли ИИ-озвучки от Ютуба при выборе аудиодорожки
skip_ai_dub=yes
 # Предпочитать ли дорожки "Постоянный уровень громкости"
prefer_drc=no

 # Выбираемый формат субтитров. Доступны: vtt | srt | srv3 | ttml
sub_format=vtt
 # Язык метаданных, возвращаемых парсером
metadata_lang=ru
 # Язык автопереведённых субтитров, добавляемых в дополнение к обычным в список субтитров
 # (auto - согласно настройке плеера --slang, либо двухбуквенный код языка, либо пустое поле)
autosub_lang=auto
 # Язык аудиодорожки, выбираемой по умолчанию (auto - согласно настройке плеера --alang, пустое поле - выбор оригинальной)
audio_lang=auto
 # none - относиться к автоматическим субтитрам как к обычным; загружать автопереведённые на языке, указанном в autosub_lang
 # deselect - добавлять автоматические субтитры в список, но не выбирать по умолчанию; загружать автопереведённые
 # skip-translated - добавлять только авто-сгенерированные субтитры в список и не выбирать их по умолчанию
 # skip - пропускать все автоматические субтитры
auto_subs_action=deselect

 # Экстрактор, дополнительно используемый, если для ролика может быть доступен поток "1080p Premium"
premium_extractor=
 # Экстрактор, испольуемый для YT Kids роликов, если выбранный по умолчанию их не открывает
yt_kids_extractor=ios_reel
 # Экстрактор, используемый для получения дорожек с переводами в мультиязычных видео, если основной их не предоставляет
dubbed_tracks_extractor=
 # Экстрактор, используемый для получения потоков на прямых трансляциях
livestream_extractor=android_vr_reel
 # Прокси, используемый для открытия роликов с региональными ограничениями. Прокси, выставленный в плеере, используется скриптом автоматически
 # Работает при использовании английского и русского языков метаданных, либо если включена опция ниже
geoblock_proxy=
 # Изредка для роликов с региональными ограничениями Ютуб не сообщает о причине недоступности видео
 # С этой опцией повторный парсинг с прокси будет выполняться всегда при характерной ошибке, чтобы охватить и такие случаи, ценой возможных напрасных попыток
proxy_when_unsure=no

 # Путь к исполняемому файлу curl, используемому для парсинга
curl_path=curl
 # Путь к файлу кэша, используемому для ускорения первого ("холодного") парсинга после запуска плеера (пустое поле для отключения)
cache_path=~~/youtube_parser_cache.json

 # Выводить ли дополнительно на экран ошибки парсинга
osd_errors=yes
 # Показывать ли прогресс парсинга плейлистов и каналов в поле для названия видео
show_parsing_progress=yes